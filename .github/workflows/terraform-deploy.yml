name: Terraform Deploy

on:
  workflow_run:
    workflows: ["Docker Build and Push"]
    types:
      - completed
  workflow_dispatch:

env:
  AWS_REGION: us-east-2
  TF_DIR: ./terraform
  APP_URL: https://it-tools.abdijalil.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.10.0

    - name: Terraform Init
      working-directory: ${{ env.TF_DIR }}
      run: terraform init

    - name: Terraform Format Check
      working-directory: ${{ env.TF_DIR }}
      run: terraform fmt -check -recursive

    - name: Terraform Validate
      working-directory: ${{ env.TF_DIR }}
      run: terraform validate

    - name: Run tfsec
      uses: aquasecurity/tfsec-action@v1.0.0
      with:
        working_directory: ${{ env.TF_DIR }}
        soft_fail: true

    - name: Get latest ECR image tag
      id: get-image
      run: |
        IMAGE_TAG=$(aws ecr describe-images --repository-name it-tools --region ${{ env.AWS_REGION }} \
          --query 'sort_by(imageDetails, &imagePushedAt)[-1].imageTags[0]' \
          --output text)
        echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

    - name: Terraform Plan
      working-directory: ${{ env.TF_DIR }}
      run: terraform plan -var="container_image=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/it-tools:${{ steps.get-image.outputs.image_tag }}"

    - name: Terraform Apply
      working-directory: ${{ env.TF_DIR }}
      run: terraform apply -auto-approve -var="container_image=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/it-tools:${{ steps.get-image.outputs.image_tag }}"

    - name: Health Check
      run: |
        sleep 120
        curl --fail --retry 5 --retry-delay 10 ${{ env.APP_URL }}
        echo "Health check passed"